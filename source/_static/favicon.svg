<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081b33"/>
      <stop offset="100%" stop-color="#133b66"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- Network / Tree edges -->
  <g stroke="url(#cyanGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="32" y1="12" x2="18" y2="34"/>
    <line x1="32" y1="12" x2="46" y2="34"/>
    <line x1="18" y1="34" x2="12" y2="51"/>
    <line x1="46" y1="34" x2="52" y2="51"/>
    <line x1="18" y1="34" x2="46" y2="34"/>
    <line x1="32" y1="12" x2="32" y2="34"/>
    <line x1="32" y1="34" x2="24" y2="49"/>
    <line x1="32" y1="34" x2="40" y2="49"/>
    <line x1="18" y1="34" x2="24" y2="49"/>
    <line x1="46" y1="34" x2="40" y2="49"/>
    <line x1="12" y1="51" x2="24" y2="49"/>
    <line x1="52" y1="51" x2="40" y2="49"/>
  </g>

  <!-- Network Nodes -->
  <circle cx="32" cy="12" r="4.2" fill="#ffffff" stroke="#00f5ff" stroke-width="2"/>
  <circle cx="18" cy="34" r="3.4" fill="#00f5ff" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="32" cy="34" r="3.4" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="46" cy="34" r="3.4" fill="#00f5ff" stroke="#ffffff" stroke-width="1.2"/>
  
  <circle cx="12" cy="51" r="3" fill="#00f5ff" stroke="#ffffff" stroke-width="1"/>
  <circle cx="24" cy="49" r="3" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
  <circle cx="40" cy="49" r="3" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
  <circle cx="52" cy="51" r="3" fill="#00f5ff" stroke="#ffffff" stroke-width="1"/>
</svg>